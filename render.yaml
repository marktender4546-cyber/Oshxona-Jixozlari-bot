services:
  - type: web
    name: aqua-home-telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: APP_NAME
        value: AQUA HOME
      - key: PYTHON_VERSION
        value: 3.13.5
